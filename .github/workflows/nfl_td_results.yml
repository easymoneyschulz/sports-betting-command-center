name: NFL TD Result Tracking
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"
permissions:
  contents: write
concurrency:
  group: nfl-td-history
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nflreadpy pandas pyarrow
      - name: Freeze predictions and grade completed games
        run: python automation/track_nfl_td_results.py
      - name: Publish historical tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public_data/nfl_td_projection_history.csv
          if test -f public_data/nfl_td_parlay_history.csv; then
            git add public_data/nfl_td_parlay_history.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL TD tracking history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
