name: NBA V2 Snapshot Publisher
on:
  schedule:
    # 4 PM America/Chicago: 21 UTC in daylight time, 22 UTC in standard time.
    - cron: '0 21,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-v2-shared-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check 4 PM Central schedule (DST aware)
        id: central_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Chicago date +%H)" = "16" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: not 4 PM Central"
          fi
      - uses: actions/checkout@v4
        if: steps.central_time.outputs.run == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.central_time.outputs.run == 'true'
        with:
          python-version: '3.11'
      - if: steps.central_time.outputs.run == 'true'
        run: pip install pandas requests numpy "scikit-learn==1.6.1" joblib
      - name: Fetch PropLine NBA player-points odds
        if: steps.central_time.outputs.run == 'true'
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python automation/fetch_nba_propline_odds.py
      - name: Build NBA daily player baseline
        if: steps.central_time.outputs.run == 'true'
        run: python automation/build_nba_rolling_baseline.py
      - name: Restore public recovered model and verify checksum
        if: steps.central_time.outputs.run == 'true'
        run: |
          mkdir -p models
          cat models/nba_v2_recovered_model.b64.part* | base64 --decode > models/nba_v2_frozen_2026_model.joblib
          echo 'f5ac39a7f1e94ce3b1ec4e918986e9e74dce280557f03db4b38b344be0dcb27f  models/nba_v2_frozen_2026_model.joblib' | sha256sum -c -
          echo 'NBA_V2_READY=true' >> "$GITHUB_ENV"
      - name: Generate recovered NBA V2 candidate paper predictions
        if: steps.central_time.outputs.run == 'true' && env.NBA_V2_READY == 'true'
        run: python automation/run_nba_v2_recovered_candidate.py
      - name: Validate and format original model snapshots
        if: steps.central_time.outputs.run == 'true'
        run: python automation/publish_nba_v2.py
      - name: Match verified odds to NBA V2 dashboard cards
        if: steps.central_time.outputs.run == 'true'
        run: python automation/match_nba_recovered_odds.py
      - name: Rank daily NBA V2 paper opportunities
        if: steps.central_time.outputs.run == 'true' && env.NBA_V2_READY == 'true'
        run: python automation/rank_nba_v2_daily.py
      - name: Commit only changed public NBA snapshot
        if: steps.central_time.outputs.run == 'true'
        run: |
          for path in public_data/nba_rolling_game_logs.csv public_data/nba_daily_rebuilt_projections.csv public_data/nba_daily_active_projections.csv; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if [ -f public_data/nba_v2_recovered_prop_comparison.csv ]; then
            git add public_data/nba_v2_recovered_prop_comparison.csv
          fi
          if [ -f public_data/nba_v2_recovered_prop_comparison.csv ]; then
            git add public_data/nba_v2_recovered_prop_comparison.csv
          fi
          if [ -f public_data/nba_v2_recovered_candidate_predictions.csv ]; then
            git add public_data/nba_v2_recovered_candidate_predictions.csv
          fi
          if [ -f public_data/nba_v2_daily_top5.csv ]; then
            git add public_data/nba_v2_daily_top5.csv
          fi
          if [ -f public_data/nba_v2_propline_odds.csv ]; then
            git add public_data/nba_v2_propline_odds.csv
          fi
          if [ -f public_data/nba_v2_latest_player_points.csv ]; then
            git add public_data/nba_v2_latest_player_points.csv
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish verified NBA odds and V2 snapshot"
            # Avoid rebasing generated CSVs across concurrent publisher commits.
            # Re-run from latest main on conflict rather than silently choosing
            # one version and risking lost results.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "NBA snapshot published successfully"
                exit 0
              fi
              echo "::warning::main advanced during publish; retrying with a fresh checkout"
              git fetch origin main
              git reset --soft origin/main
              git reset
              for path in public_data/nba_rolling_game_logs.csv public_data/nba_daily_rebuilt_projections.csv public_data/nba_daily_active_projections.csv public_data/nba_v2_recovered_prop_comparison.csv public_data/nba_v2_recovered_candidate_predictions.csv public_data/nba_v2_daily_top5.csv public_data/nba_v2_propline_odds.csv public_data/nba_v2_latest_player_points.csv; do
                if [ -f "$path" ]; then git add "$path"; fi
              done
              if git diff --cached --quiet; then
                echo "No snapshot changes to publish"
                exit 0
              fi
              git commit -m "Publish verified NBA odds and V2 snapshot"
            done
            echo "::error::NBA publish could not push after 3 attempts"
            exit 1
          fi

