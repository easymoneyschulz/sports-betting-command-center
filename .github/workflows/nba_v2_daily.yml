name: NBA V2 Snapshot Publisher
on:
  schedule:
    - cron: '15 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-v2-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Validate and format original model snapshots
        run: python automation/publish_nba_v2.py
      - name: Commit only changed public NBA snapshot
        run: |
          if [ -f public_data/nba_v2_latest_player_points.csv ]; then
            git add public_data/nba_v2_latest_player_points.csv
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Publish validated NBA V2 paper snapshot"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
