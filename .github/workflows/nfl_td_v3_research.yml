name: NFL Anytime TD V3 Research
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 4"
    - cron: "0 14 * * 0"
permissions:
  contents: write
jobs:
  touchdown-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify model bundle exists
        id: models
        shell: bash
        run: |
          if test -s automation/models/nfl_td_v3/fitted_coefficients.txt; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TD model bundle not installed; skipping predictions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python dependencies
        if: steps.models.outputs.ready == 'true'
        run: pip install nflreadpy pandas numpy pyarrow joblib requests
      - name: Generate research-only TD predictions
        if: steps.models.outputs.ready == 'true'
        run: python automation/run_nfl_td_v3_research.py --output-dir research_snapshots/nfl_td
      - name: Upload research snapshot
        if: steps.models.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-td-v3-research-${{ github.run_id }}
          path: research_snapshots/nfl_td/*.csv
          if-no-files-found: error
          retention-days: 90
      - name: Validate and stage public research snapshot
        if: steps.models.outputs.ready == 'true'
        run: python automation/publish_nfl_td_research.py
      - name: Fetch verified anytime TD odds
        if: steps.models.outputs.ready == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python automation/fetch_nfl_td_odds.py
      - name: Build five-leg research parlay
        if: steps.models.outputs.ready == 'true'
        run: python automation/build_nfl_td_five_leg.py
      - name: Commit latest research snapshot for Streamlit
        if: steps.models.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data/nfl_td_v3_latest.csv public_data/nfl_td_five_leg_latest.json
          if git diff --cached --quiet; then
            echo "No changed TD snapshot"
          else
            git commit -m "Update NFL TD V3 research snapshot [skip ci]"
            git push origin HEAD:main
          fi
