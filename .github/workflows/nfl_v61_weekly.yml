name: NFL V6.1 Research Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/build_nfl_v61_paper_picks.py'
      - '.github/workflows/nfl_v61_weekly.yml'
  schedule:
    # Both CST and CDT candidate hours.
    # The internal timezone gate selects the correct run.
    - cron: "0 15 * * 3"
    - cron: "0 16 * * 3"
    - cron: "0 21 * * 4"
    - cron: "0 22 * * 4"
    - cron: "30 15 * * 0"
    - cron: "30 16 * * 0"

permissions:
  contents: write

jobs:
  nfl-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Central Time schedule
        id: schedule_gate
        shell: bash
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          cron = os.environ.get("TRIGGER_CRON", "").strip()

          now = datetime.now(timezone.utc)
          central = now.astimezone(
              ZoneInfo("America/Chicago")
          )

          # Each cron has a unique UTC hour.
          # Only the candidate matching the current
          # Central Time offset is permitted.
          allowed_crons = {
              -5: {
                  "0 15 * * 3",
                  "0 21 * * 4",
                  "30 15 * * 0",
              },
              -6: {
                  "0 16 * * 3",
                  "0 22 * * 4",
                  "30 16 * * 0",
              },
          }

          offset = int(
              central.utcoffset().total_seconds() / 3600
          )

          if event in ("workflow_dispatch", "push"):
              allowed = True
          elif event == "schedule":
              allowed = cron in allowed_crons.get(
                  offset, set()
              )
          else:
              allowed = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(
                  f"run={'true' if allowed else 'false'}\n"
              )

          print("Event:", event)
          print("Trigger cron:", cron)
          print("Central time:", central.isoformat())
          print("UTC offset:", offset)
          print("Research run allowed:", allowed)
          PY

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pyarrow requests

      - name: Verify frozen model and rules
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          files = {
              "automation/models/nfl_v61_frozen_2026_model.joblib":
                  "18ee19e1f38908d40ca420d06c05213ae802418a99ea6a999de378e139e5483e",
              "automation/models/nfl_v61_step32_frozen_rules.json":
                  "f927f3a6153d4cf3597a67d39c41e43e2cd8bd1b4da70ec2713bda32dc5ea66b",
          }

          for name, expected in files.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, f"Hash mismatch: {name}"
              print("Verified:", name)
          PY

      - name: Build NFL weekly research snapshot
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          python automation/prepare_nfl_v61_weekly.py             --output-dir research_snapshots/nfl

      - name: Run NFL V6.1 research projections
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          files = sorted(
              Path("research_snapshots/nfl").glob(
                  "nfl_v61_*_features.csv"
              )
          )

          if len(files) != 1:
              raise RuntimeError(
                  f"Expected one feature snapshot, found {len(files)}"
              )

          command = [
              sys.executable,
              "automation/project_nfl_v61_research.py",
              "--features",
              str(files[0]),
              "--output-dir",
              "research_snapshots/nfl",
          ]

          subprocess.run(command, check=True)
          PY

      - name: Generate sportsbook-verified paper picks
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          projections=sorted(Path('research_snapshots/nfl').glob('nfl_v61_research_projection_*.csv'))
          if len(projections)!=1:
              raise RuntimeError('Expected exactly one projection file')
          subprocess.run([sys.executable,'automation/build_nfl_v61_paper_picks.py','--projections',str(projections[0]),'--output-dir','research_snapshots/nfl'],check=True)
          PY

      - name: Publish paper snapshots for Streamlit
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("research_snapshots/nfl")
          dest = Path("public_data")
          dest.mkdir(exist_ok=True)
          for pattern, output in [
              ("nfl_v61_research_projection_*.csv", "nfl_v61_latest_projection.csv"),
              ("nfl_v61_paper_picks_*.csv", "nfl_v61_latest_paper_picks.csv"),
          ]:
              matches = sorted(root.glob(pattern))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one {pattern}, got {len(matches)}")
              shutil.copyfile(matches[0], dest / output)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data/nfl_v61_latest_projection.csv public_data/nfl_v61_latest_paper_picks.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL V6.1 public paper snapshot"
            git push
          fi

      - name: Upload research snapshot
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v61-research-${{ github.run_id }}
          path: research_snapshots/nfl/*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Confirm publication disabled
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          echo "NFL research snapshot saved as GitHub artifact."
          echo "Sportsbook odds verified where available."
          echo "Paper selections saved in run artifact; no wagers placed."
          echo "No website files modified."
